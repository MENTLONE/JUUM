name: Build PDF manual

on:
  push:
    branches: [main]
    paths:
      - 'manual.html'
      - 'scripts/build_manual_pdf.py'
      - '.github/workflows/build-manual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab beautifulsoup4
      - run: python scripts/build_manual_pdf.py
      - name: Commit updated PDF
        run: |
          if git diff --quiet -- JUUM_User_Manual.pdf; then
            echo "PDF is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JUUM_User_Manual.pdf
          git commit -m "Build updated PDF user manual"
          git push
